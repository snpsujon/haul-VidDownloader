services:
  haul:
    build: .
    ports:
      - "6456:8000"
    environment:
      HAUL_UPDATE_ON_START: "1"
      HAUL_ADMIN_PASSWORD: "Asdf019lkjh"     # pick your own; the admin page stays off until you do
      HAUL_PUBLIC_URL: "https://stackforge-pro.xyz"
      HAUL_CONTACT_EMAIL: "hello@stackforge-pro.xyz"  # shown on the Contact page
      # HAUL_API_KEYS: "change-me"          # turn on to require an API key
      HAUL_TRUST_PROXY: "1"                  # real visitor addresses from Cloudflare/nginx (needed for blocking and limits)
    volumes:
      - haul-data:/data
    restart: unless-stopped

volumes:
  haul-data:
