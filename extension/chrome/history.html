<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Download history · Haul</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { padding: 32px 16px 48px; }
    .wrap { max-width: 760px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 0 0 20px; display: flex; align-items: center; gap: 10px; }
    .bar-top { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
    .bar-top input { flex: 1; min-width: 200px; }
    .bar-top .seg { flex: none; }
    .bar-top .seg button { padding: 0 12px; }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 22px 0 8px; }
    ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    li { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; }
    .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta { font-size: 12px; color: var(--muted); grid-column: 1; }
    .meta .gone { color: var(--danger); }
    .acts { grid-row: 1 / span 2; grid-column: 2; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .x { border: 0; background: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 0 4px; }
    .x:hover { color: var(--text); }
    .empty { text-align: center; color: var(--muted); padding: 48px 0; }
    @media (max-width: 560px) {
      li { grid-template-columns: 1fr; }
      .acts { grid-row: auto; grid-column: 1; justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1><img src="icons/icon48.png" width="32" height="32" alt=""> Download history</h1>
    <div class="bar-top">
      <input id="q" type="text" placeholder="Search titles and sites" spellcheck="false">
      <div class="seg" role="tablist">
        <button data-f="all" aria-selected="true">All</button>
        <button data-f="video" aria-selected="false">Video</button>
        <button data-f="audio" aria-selected="false">Audio</button>
      </div>
      <button id="clearAll" class="btn small">Clear history</button>
    </div>
    <div id="list"></div>
    <p id="empty" class="empty" hidden>Nothing here yet. Things you save on this PC with Haul show up here.</p>
  </div>
  <script src="common.js"></script>
  <script src="history.js"></script>
</body>
</html>
