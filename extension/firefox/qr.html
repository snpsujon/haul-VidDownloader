<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Send to phone · Haul</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
    .card { width: 100%; max-width: 380px; text-align: center; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    .title { font-weight: 600; margin: 14px 0 2px; overflow-wrap: anywhere; }
    canvas { border-radius: 16px; background: #fff; margin-top: 16px; }
    .row { display: flex; gap: 8px; justify-content: center; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <img src="icons/icon48.png" width="40" height="40" alt="">
    <h1>Send to phone</h1>
    <div id="title" class="title"></div>
    <div id="host" class="muted small"></div>
    <canvas id="qr"></canvas>
    <p id="hint" class="muted"></p>
    <div class="row">
      <button id="copy" class="btn small">Copy link</button>
      <button id="switchMode" class="btn small"></button>
    </div>
  </div>
  <script src="lib/qrcode.js"></script>
  <script src="common.js"></script>
  <script src="qr.js"></script>
</body>
</html>
